title: Piergiorgio Ladisa
tagline: "Offensive Security Engineer · Red Team · Supply Chain Security"
description: >-
  Offensive Security Engineer specializing in software supply chain security.
  Red Team Operator. PhD in Computer Science. OSCP · CRTO.
author:
  name: Piergiorgio Ladisa

url: "https://piergiorgioladisa.github.io"
baseurl: ""

github_username: piergiorgioladisa
linkedin_username: piergiorgio-ladisa
hackerone_username: piergiorgio_ladisa
scholar_url: "https://scholar.google.com/citations?user=LMHpRBkAAAAJ"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:slug/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - vendor

# Feed
feed:
  path: feed.xml

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Piergiorgio Ladisa"
